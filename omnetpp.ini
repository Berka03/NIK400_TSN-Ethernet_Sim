[General]
# Common settings for all configurations
sim-time-limit = 30s
**.vector-recording = true
**.scalar-recording = true
record-eventlog = true
cmdenv-express-mode = false

# Network autoconfiguration
*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/></config>")

# ========== TRAFFIC PROFILES ==========

# Sensor 1: High-priority, periodic (1ms, 128B)
*.sensor1.numUdpApps = 1
*.sensor1.udpApp[0].typename = "UdpSourceApp"
*.sensor1.udpApp[0].destAddresses = "plc"
*.sensor1.udpApp[0].destPort = 1001
*.sensor1.udpApp[0].messageLength = 128B
*.sensor1.udpApp[0].sendInterval = 1ms
*.sensor1.udpApp[0].packetName = "Sensor1-HighPriority"
*.sensor1.udpApp[0].vlanId = 100
*.sensor1.udpApp[0].pcp = 7  # Highest priority

# Sensor 2: Medium-priority, periodic (2ms, 256B)
*.sensor2.numUdpApps = 1
*.sensor2.udpApp[0].typename = "UdpSourceApp"
*.sensor2.udpApp[0].destAddresses = "plc"
*.sensor2.udpApp[0].destPort = 1002
*.sensor2.udpApp[0].messageLength = 256B
*.sensor2.udpApp[0].sendInterval = 2ms
*.sensor2.udpApp[0].packetName = "Sensor2-MediumPriority"
*.sensor2.udpApp[0].vlanId = 200
*.sensor2.udpApp[0].pcp = 6  # Medium priority

# Sensor 3: Low-priority, bursty (best-effort)
*.sensor3.numUdpApps = 1
*.sensor3.udpApp[0].typename = "UdpSourceApp"
*.sensor3.udpApp[0].destAddresses = "plc"
*.sensor3.udpApp[0].destPort = 1003
*.sensor3.udpApp[0].messageLength = uniform(500B, 1500B)
*.sensor3.udpApp[0].sendInterval = exponential(10ms)
*.sensor3.udpApp[0].packetName = "Sensor3-BestEffort"
*.sensor3.udpApp[0].vlanId = 300
*.sensor3.udpApp[0].pcp = 0  # Best effort

# HMI: Bursty TCP traffic (diagnostics)
*.hmi.numTcpApps = 1
*.hmi.tcpApp[0].typename = "TcpBasicClientApp"
*.hmi.tcpApp[0].connectAddress = "plc"
*.hmi.tcpApp[0].connectPort = 2000
*.hmi.tcpApp[0].sendInterval = exponential(100ms)
*.hmi.tcpApp[0].dataTransferMode = "object"
*.hmi.tcpApp[0].messageLength = uniform(1kB, 10kB)
*.hmi.tcpApp[0].packetName = "HMI-Diagnostics"

# PLC: Sink for all UDP traffic
*.plc.numUdpApps = 4
*.plc.udpApp[0].typename = "UdpSink"
*.plc.udpApp[0].localPort = 1001
*.plc.udpApp[1].typename = "UdpSink"
*.plc.udpApp[1].localPort = 1002
*.plc.udpApp[2].typename = "UdpSink"
*.plc.udpApp[2].localPort = 1003
# PLC to Actuator traffic
*.plc.udpApp[3].typename = "UdpSourceApp"
*.plc.udpApp[3].destAddresses = "actuator1"
*.plc.udpApp[3].destPort = 3000
*.plc.udpApp[3].messageLength = 64B
*.plc.udpApp[3].sendInterval = 5ms
*.plc.udpApp[3].packetName = "PLC-ActuatorCmd"
*.plc.udpApp[3].vlanId = 400
*.plc.udpApp[3].pcp = 5  # Medium-high priority

# PLC TCP server for HMI
*.plc.numTcpApps = 1
*.plc.tcpApp[0].typename = "TcpGenericSrvApp"
*.plc.tcpApp[0].localPort = 2000

# Actuator: Receives commands from PLC
*.actuator1.numUdpApps = 1
*.actuator1.udpApp[0].typename = "UdpSink"
*.actuator1.udpApp[0].localPort = 3000

# ========== MEASUREMENT CONFIGURATION ==========
[Measurements]
# Application layer statistics
**.udpApp[*].rcvdPk:vector.record = true
**.udpApp[*].sentPk:vector.record = true
**.tcpApp[*].rcvdPk:vector.record = true
**.tcpApp[*].sentPk:vector.record = true

# Network layer delay statistics (critical for comparison)
**.networkLayer.udp.packetDelay:vector.record = true
**.networkLayer.udp.packetDelay:histogram.record = true


# Queue statistics
**.queue[*].queueLength:vector.record = true
**.queue[*].dropPk:vector.record = true

# MAC layer statistics
**.mac[*].txPk:vector.record = true
**.mac[*].rxPk:vector.record = true

# Throughput statistics
**.networkLayer.udp.throughput:vector.record = true

# ========== CONFIGURATION 1: TRADITIONAL ETHERNET (FIFO) ==========
[Config Ethernet_FIFO]
network = IndustrialCell
description = "Traditional Ethernet - FIFO Queuing (Baseline)"

# Use standard Ethernet switch with FIFO queuing
*.switch.typename = "EthernetSwitch"
*.switch.numPorts = 6

# Simple FIFO queue configuration
*.switch.bufferSize = 100000B  # 100KB buffer per port
*.switch.queue.typename = "DropTailQueue"

# Traffic generation (same for all configurations)
*.sensor1.udpApp[0].startTime = 0s
*.sensor2.udpApp[0].startTime = 0s
*.sensor3.udpApp[0].startTime = 0s
*.plc.udpApp[3].startTime = 0s
*.hmi.tcpApp[0].tOpen = 0s

# Add verbose debugging
*.sensor*.udpApp[*].verbose = true
*.plc.udpApp[*].verbose = true
*.hmi.tcpApp[*].verbose = true
*.plc.tcpApp[*].verbose = true

# Optional: Also add network layer debugging
*.sensor*.udp.verbose = true
*.plc.udp.verbose = true
*.hmi.tcp.verbose = true


# ========== CONFIGURATION 2: ETHERNET WITH PRIORITY QUEUING ==========
[Config Ethernet_Priority]
network = IndustrialCell
description = "Ethernet with Strict Priority Queuing (SPQ)"

*.switch.typename = "EthernetSwitch"
*.switch.numPorts = 6

# Enable priority queuing
*.switch.hasEgressTrafficShaping = true
*.switch.egressTrafficShaping.numTrafficClasses = 8

# Map VLAN PCP to traffic classes
*.switch.egressTrafficShaping.trafficClass[0].name = "BE"
*.switch.egressTrafficShaping.trafficClass[0].priority = 0
*.switch.egressTrafficShaping.trafficClass[5].name = "Actuator"
*.switch.egressTrafficShaping.trafficClass[5].priority = 5
*.switch.egressTrafficShaping.trafficClass[6].name = "Sensor2"
*.switch.egressTrafficShaping.trafficClass[6].priority = 6
*.switch.egressTrafficShaping.trafficClass[7].name = "Sensor1"
*.switch.egressTrafficShaping.trafficClass[7].priority = 7

# Traffic generation (same timing)
*.sensor1.udpApp[0].startTime = 0.1s
*.sensor2.udpApp[0].startTime = 0.2s
*.sensor3.udpApp[0].startTime = 0.3s
*.plc.udpApp[3].startTime = 0.4s
*.hmi.tcpApp[0].tOpen = 0.5s

# ========== CONFIGURATION 3: TSN - TIME-AWARE SHAPER ==========
[Config TSN_TimeAware]
network = IndustrialCell
description = "TSN with Time-Aware Shaper (802.1Qbv)"

# Change switch type to TsnSwitch
*.switch.typename = "TsnSwitch"
*.switch.numPorts = 6

# Enable Time-Aware Shaper
*.switch.hasTrafficScheduling = true
*.switch.trafficScheduling.typename = "Ieee8021qTs"

# Configure Gate Control List - 1ms cycle time
# High priority: 0-500µs, Low priority: 500-1000µs
*.switch.trafficScheduling.gateControlList = xml("<GateControlList><cycle><slot duration='500us'><open>7,6</open></slot><slot duration='500us'><open>5,0</open></slot></cycle></GateControlList>")

# Enable synchronization (optional)
*.switch.hasClockSynchronization = true

# Traffic generation with synchronization
*.sensor1.udpApp[0].startTime = 0.1s
*.sensor2.udpApp[0].startTime = 0.2s
*.sensor3.udpApp[0].startTime = 0.3s
*.plc.udpApp[3].startTime = 0.4s
*.hmi.tcpApp[0].tOpen = 0.5s

# ========== CONFIGURATION 4: TSN - CREDIT-BASED SHAPER ==========
[Config TSN_CreditBased]
network = IndustrialCell
description = "TSN with Credit-Based Shaper (802.1Qav)"

*.switch.typename = "TsnSwitch"
*.switch.numPorts = 6

# Enable Credit-Based Shaper
*.switch.hasCreditBasedShaper = true
*.switch.creditBasedShaper.typename = "Ieee8021qCreditBasedShaper"

# Configure CBS parameters
*.switch.creditBasedShaper.numTrafficClasses = 4
*.switch.creditBasedShaper.trafficClass[0].name = "Sensor1"
*.switch.creditBasedShaper.trafficClass[0].priority = 7
*.switch.creditBasedShaper.trafficClass[0].idleSlope = 0.4  # 40% of bandwidth
*.switch.creditBasedShaper.trafficClass[1].name = "Sensor2"
*.switch.creditBasedShaper.trafficClass[1].priority = 6
*.switch.creditBasedShaper.trafficClass[1].idleSlope = 0.3  # 30% of bandwidth
*.switch.creditBasedShaper.trafficClass[2].name = "Actuator"
*.switch.creditBasedShaper.trafficClass[2].priority = 5
*.switch.creditBasedShaper.trafficClass[2].idleSlope = 0.2  # 20% of bandwidth
*.switch.creditBasedShaper.trafficClass[3].name = "BE"
*.switch.creditBasedShaper.trafficClass[3].priority = 0
*.switch.creditBasedShaper.trafficClass[3].idleSlope = 0.1  # 10% of bandwidth

# Traffic generation
*.sensor1.udpApp[0].startTime = 0.1s
*.sensor2.udpApp[0].startTime = 0.2s
*.sensor3.udpApp[0].startTime = 0.3s
*.plc.udpApp[3].startTime = 0.4s
*.hmi.tcpApp[0].tOpen = 0.5s

# ========== ANALYSIS CONFIGURATION ==========
[Analysis]
# Post-processing for comparison
**.networkLayer.udp.packetDelay:statistic.record = true
**.networkLayer.udp.packetDelay:statistic.title = "End-to-End Delay"
**.queue[*].queueLength:statistic.record = true
**.queue[*].queueLength:statistic.title = "Queue Length"
